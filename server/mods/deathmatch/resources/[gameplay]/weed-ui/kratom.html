<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap");

      :root {
        --green: #7fff00;
        --green-soft: #7fff00;
        --mint: #7fff00;
        --amber: #ffe66d;
        --purple: #ee1426;
        --panel: rgba(19, 19, 19, 0.66);
        --panel-deep: rgba(9, 9, 9, 0.76);
        --line: rgba(127, 255, 0, 0.34);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: "Share Tech Mono", monospace;
        color: var(--green);
        background: transparent;
        padding-bottom: 10px;
        user-select: none;
        -webkit-user-select: none;
      }

      .garden-ui {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(127, 255, 0, 0.05),
            transparent 32%
          ),
          linear-gradient(135deg, rgba(19, 19, 19, 0.82), rgba(8, 8, 8, 0.62));
        box-shadow:
          inset 0 0 32px rgba(127, 255, 0, 0.045),
          0 0 14px rgba(127, 255, 0, 0.07);
      }

      .garden-ui::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025),
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 5px
        );
        opacity: 0.5;
      }

      .topbar {
        position: relative;
        z-index: 1;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: rgba(27, 27, 27, 0.52);
        border-bottom: 1px solid var(--line);
        cursor: move;
        user-select: none;
      }

      .title-block {
        min-width: 0;
      }

      .eyebrow {
        color: var(--green);
        font-size: 11px;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 2px;
        font-family: "Orbitron", sans-serif;
        font-size: 18px;
        color: #fff;
        text-shadow: 0 0 7px rgba(127, 255, 0, 0.3);
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      button:focus {
        outline: none;
      }

      .close-btn {
        width: 34px;
        height: 34px;
        border: 1px solid rgba(127, 255, 0, 0.55);
        border-radius: 6px;
        color: var(--mint);
        background: rgba(0, 0, 0, 0.22);
        font-family: "Orbitron", sans-serif;
        cursor: pointer;
      }

      .close-btn:hover {
        border-color: var(--green);
        color: #fff;
        box-shadow: 0 0 14px rgba(127, 255, 0, 0.22);
      }

      .content {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 12px;
        height: calc(100vh - 56px);
        padding: 12px 12px 30px;
      }

      .panel {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: inset 0 0 16px rgba(127, 255, 0, 0.035);
        backdrop-filter: blur(4px);
      }

      .main-panel {
        display: flex;
        flex-direction: column;
        padding: 14px 14px 16px;
      }

      .status-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric {
        min-height: 74px;
        padding: 10px;
        border: 1px solid rgba(127, 255, 0, 0.2);
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.18);
      }

      .metric-label {
        color: var(--green);
        font-size: 11px;
        text-transform: uppercase;
      }

      .metric-value {
        margin-top: 7px;
        font-family: "Share Tech Mono", monospace;
        font-size: 18px;
        color: #fff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .garden-scope {
        position: relative;
        flex: 1;
        min-height: 180px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 10px;
        padding: 12px;
        overflow: hidden;
        border: 1px solid rgba(127, 255, 0, 0.24);
        border-radius: 8px;
        background:
          linear-gradient(rgba(127, 255, 0, 0.07) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(127, 255, 0, 0.07) 1px,
            transparent 1px
          ),
          rgba(11, 11, 11, 0.48);
        background-size: 28px 28px;
      }

      .strain-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .strain-header .data-header {
        flex: 1;
        margin: 0;
      }

      .strain-legend {
        display: flex;
        gap: 8px;
        color: var(--green);
        font-size: 10px;
        text-transform: uppercase;
      }

      .legend-item::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 4px;
        border-radius: 2px;
        background: var(--strain-color);
        box-shadow: 0 0 7px var(--strain-color);
      }

      .strain-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        min-height: 0;
      }

      .strain-tile {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        padding: 7px;
        overflow: hidden;
        border: 1px solid var(--strain-color);
        border-radius: 0;
        color: var(--strain-color);
        background: rgba(11, 11, 11, 0.78);
        font-family: "Share Tech Mono", monospace;
        text-align: center;
        cursor: pointer;
        box-shadow: inset 0 0 9px rgba(127, 255, 0, 0.025);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }

      .strain-tile:hover {
        background: rgba(16, 16, 16, 0.82);
        transform: translateY(-1px);
      }

      .strain-tile.selected {
        transform: translateY(1px) scale(0.985);
        background: rgba(6, 6, 6, 0.88);
        box-shadow:
          inset 0 3px 9px rgba(0, 0, 0, 0.72),
          inset 0 0 10px rgba(127, 255, 0, 0.05);
      }

      .strain-check {
        position: absolute;
        top: 5px;
        left: 6px;
        width: 13px;
        height: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--strain-color);
        border-radius: 3px;
        color: transparent;
        background: rgba(0, 0, 0, 0.38);
        font-size: 10px;
        line-height: 1;
      }

      .strain-tile.selected .strain-check {
        color: #0d0d0d;
        background: var(--strain-color);
        box-shadow: 0 0 6px var(--strain-color);
      }

      .strain-tile.selected .strain-check::after {
        content: "\2713";
      }

      .strain-number {
        position: absolute;
        top: 5px;
        right: 6px;
        font-size: 9px;
        opacity: 0.72;
      }

      .strain-symbol {
        display: block;
        color: var(--strain-color);
        font-family: "Orbitron", sans-serif;
        font-size: clamp(15px, 2.4vw, 24px);
        line-height: 1;
        text-shadow: none;
      }

      .strain-tile.selected .strain-symbol {
        text-shadow: none;
      }

      .strain-name {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        font-size: 9px;
        line-height: 1.05;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scope-ring {
        position: absolute;
        width: min(58vh, 58vw);
        max-width: 340px;
        aspect-ratio: 1;
        border: 2px dashed rgba(127, 255, 0, 0.34);
        border-radius: 50%;
        animation: spin 30s linear infinite;
      }

      .scope-ring.inner {
        width: min(34vh, 34vw);
        max-width: 210px;
        border-style: dotted;
        animation-duration: 16s;
        animation-direction: reverse;
      }

      .plant-core {
        position: relative;
        width: 138px;
        height: 138px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid rgba(127, 255, 0, 0.55);
        background: rgba(22, 22, 22, 0.5);
        box-shadow:
          0 0 34px rgba(127, 255, 0, 0.2),
          inset 0 0 22px rgba(127, 255, 0, 0.18);
      }

      .leaf {
        position: absolute;
        width: 46px;
        height: 72px;
        background: linear-gradient(
          180deg,
          rgba(127, 255, 0, 0.96),
          rgba(127, 255, 0, 0.36)
        );
        border-radius: 48% 52% 48% 52%;
        transform-origin: 50% 90%;
        box-shadow: 0 0 16px rgba(127, 255, 0, 0.28);
      }

      .leaf:nth-child(1) {
        transform: rotate(0deg) translateY(-24px);
      }
      .leaf:nth-child(2) {
        transform: rotate(60deg) translateY(-24px);
      }
      .leaf:nth-child(3) {
        transform: rotate(120deg) translateY(-24px);
      }
      .leaf:nth-child(4) {
        transform: rotate(180deg) translateY(-24px);
      }
      .leaf:nth-child(5) {
        transform: rotate(240deg) translateY(-24px);
      }
      .leaf:nth-child(6) {
        transform: rotate(300deg) translateY(-24px);
      }

      .core-text {
        position: relative;
        z-index: 2;
        text-align: center;
        color: #fff;
        text-shadow: 0 0 10px var(--green);
      }

      .core-text strong {
        display: block;
        font-family: "Orbitron", sans-serif;
        font-size: 26px;
      }

      .core-text span {
        color: var(--green-soft);
        font-size: 11px;
        text-transform: uppercase;
      }

      .side-panel {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 6px;
        padding: 12px 12px 20px;
      }

      .health-scope {
        position: relative;
        min-height: 118px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(127, 255, 0, 0.22);
        border-radius: 7px;
        background:
          radial-gradient(circle, rgba(127, 255, 0, 0.11), transparent 64%),
          rgba(6, 6, 6, 0.48);
      }

      .health-scope .scope-ring {
        width: 88px;
        max-width: none;
        border-color: rgba(127, 255, 0, 0.42);
      }

      .health-scope .scope-ring.inner {
        width: 65px;
        max-width: none;
        border-width: 1px;
        border-style: dashed;
        animation-duration: 60s;
        animation-direction: normal;
      }

      .health-scope .plant-core {
        width: 56px;
        height: 56px;
      }

      .health-scope .leaf {
        top: 50%;
        left: 50%;
        width: 10px;
        height: 24px;
        margin-top: -18px;
        margin-left: -5px;
        border-radius: 50% 50% 35% 35%;
        clip-path: polygon(
          50% 0,
          88% 34%,
          72% 100%,
          50% 82%,
          28% 100%,
          12% 34%
        );
        transform-origin: 50% 92%;
      }

      .health-scope .leaf:nth-child(1) {
        transform: rotate(-62deg) translateY(-9px);
      }
      .health-scope .leaf:nth-child(2) {
        transform: rotate(-38deg) translateY(-11px);
      }
      .health-scope .leaf:nth-child(3) {
        transform: rotate(-14deg) translateY(-13px);
      }
      .health-scope .leaf:nth-child(4) {
        transform: rotate(14deg) translateY(-13px);
      }
      .health-scope .leaf:nth-child(5) {
        transform: rotate(38deg) translateY(-11px);
      }
      .health-scope .leaf:nth-child(6) {
        transform: rotate(62deg) translateY(-9px);
      }

      .health-scope .core-text strong {
        color: #7fff00;
        font-size: 13px;
      }

      .health-scope .core-text {
        text-shadow: 0 0 10px #7fff00;
      }

      .health-scope .core-text span {
        font-size: 7px;
      }

      .data-header {
        color: var(--green);
        font-family: "Share Tech Mono", monospace;
        font-size: 13px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(127, 255, 0, 0.22);
        padding-bottom: 6px;
        margin-bottom: 10px;
      }

      .bar-row {
        margin-bottom: 7px;
      }

      .bar-meta {
        display: flex;
        justify-content: space-between;
        color: var(--green);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .bar {
        height: 10px;
        overflow: hidden;
        border: 1px solid rgba(127, 255, 0, 0.36);
        background: rgba(11, 11, 11, 0.66);
      }

      .fill {
        width: 50%;
        height: 100%;
        background: var(--green);
        box-shadow: none;
        transition:
          width 0.18s ease,
          background-color 0.18s ease;
      }

      .readout-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .readout {
        padding: 7px 9px;
        border: 1px solid rgba(127, 255, 0, 0.18);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.16);
      }

      .readout span {
        display: block;
        color: var(--green);
        font-size: 11px;
        text-transform: uppercase;
      }

      .readout strong {
        display: block;
        margin-top: 4px;
        color: #fff;
        font-family: "Share Tech Mono", monospace;
        font-size: 14px;
      }

      .notification-wrap {
        display: grid;
        gap: 8px;
        min-height: 0;
      }

      .note {
        height: 72px;
        min-height: 72px;
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 9px;
        align-items: start;
        overflow: hidden;
        padding: 10px;
        border: 1px solid rgba(127, 255, 0, 0.16);
        border-radius: 0;
        color: var(--mint);
        background: var(--panel-deep);
        line-height: 1.35;
      }

      .note-icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 0;
        color: #272727;
        background: #7fff00;
        font-family: "Share Tech Mono", "Consolas", monospace;
        font-size: 17px;
        box-shadow: none;
      }

      .note-title {
        margin-bottom: 4px;
        color: var(--green);
        font-family: "Share Tech Mono", "Consolas", monospace;
        font-size: 12px;
        text-transform: uppercase;
      }

      .note-message {
        display: -webkit-box;
        overflow: hidden;
        color: var(--mint);
        font-size: 13px;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .buy-section {
        display: grid;
        gap: 7px;
      }

      .buy-title {
        color: var(--green);
        font-size: 11px;
        text-transform: uppercase;
      }

      .action-btn,
      .buy-btn {
        min-height: 34px;
        padding: 7px 8px;
        border: 1px solid rgba(127, 255, 0, 0.38);
        border-radius: 0;
        color: var(--green);
        background: rgba(25, 25, 25, 0.46);
        font-family: "Share Tech Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        overflow-wrap: anywhere;
        transition:
          filter 0.14s ease,
          transform 0.14s ease,
          box-shadow 0.14s ease,
          background-color 0.14s ease;
      }

      .buy-btn {
        color: #fff;
        background: rgba(16, 16, 16, 0.58);
      }

      .buy-btn.selected,
      .action-btn.cart-selected {
        color: #fff;
        border-color: var(--green);
        background: rgba(6, 6, 6, 0.88);
        box-shadow:
          0 0 7px rgba(127, 255, 0, 0.22),
          inset 0 3px 8px rgba(0, 0, 0, 0.72);
        transform: translateY(1px);
      }

      .action-btn:hover,
      .buy-btn:hover {
        border-color: var(--green);
        filter: brightness(0.82);
        box-shadow: 0 0 3px rgba(127, 255, 0, 0.16);
      }

      .action-btn.purchase-click {
        animation: purchase-click 0.32s ease;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes purchase-click {
        0% {
          transform: scale(1);
        }
        45% {
          transform: translateY(2px) scale(0.94);
          box-shadow:
            0 0 5px rgba(127, 255, 0, 0.14),
            inset 0 3px 8px rgba(0, 0, 0, 0.72);
        }
        100% {
          transform: scale(1);
        }
      }

      /* HUD COLORS AND SURFACES */
      :root {
        --green: #7fff00;
        --green-soft: #7fff00;
        --mint: #7fff00;
        --panel: transparent;
        --panel-deep: rgba(22, 22, 22, 0.48);
        --line: rgba(127, 255, 0, 0.16);
      }

      .shop-ui,
      .garden-ui {
        border-color: rgba(127, 255, 0, 0.18);
        border-radius: 1px;
        background: linear-gradient(
          135deg,
          rgba(45, 45, 45, 0.56),
          rgba(18, 18, 18, 0.46)
        );
        box-shadow: inset 0 1px rgba(127, 255, 0, 0.12);
      }
      .shop-ui::before,
      .garden-ui::before {
        display: none;
      }
      .topbar {
        background: rgba(127, 255, 0, 0.035);
        border-bottom-color: var(--line);
      }
      h1,
      .data-header,
      .note-title,
      .strain-symbol,
      .core-text strong,
      .weapon-core strong,
      .close-btn,
      .note-icon {
        font-family: "Share Tech Mono", "Consolas", monospace;
        text-shadow: none;
      }
      h1 {
        letter-spacing: 0.4px;
      }
      .panel,
      .metric,
      .weapon-scope,
      .garden-scope {
        border-color: transparent;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }
      .data-header,
      .weapon-header {
        border-bottom-color: transparent;
      }
      .metric-label,
      .eyebrow,
      .bar-meta,
      .readout span {
        color: #7fff00;
      }
      .readout {
        border-color: transparent;
        border-radius: 0;
        background: rgba(127, 255, 0, 0.045);
      }
      .bar {
        border: 0;
        background: rgba(127, 255, 0, 0.12);
      }
      .weapon-tile,
      .strain-tile {
        background: rgba(27, 27, 27, 0.48);
      }
      .weapon-tile:hover,
      .strain-tile:hover {
        background: rgba(127, 255, 0, 0.14);
      }
      .weapon-tile.selected,
      .strain-tile.selected {
        background: rgba(127, 255, 0, 0.24);
        box-shadow: inset 0 -2px #7fff00;
      }
      .category-btn,
      .strain-check,
      .close-btn,
      .buy-btn,
      .action-btn,
      .note,
      .note-icon,
      .weapon-display,
      .health-scope {
        border-radius: 0;
      }
      .category-btn {
        background: rgba(27, 27, 27, 0.4);
      }
      .category-btn.selected,
      .category-btn:hover {
        box-shadow: none;
      }
      .note {
        border-color: rgba(127, 255, 0, 0.16);
        background: var(--panel-deep);
      }
      .note-icon {
        color: #272727;
        background: #7fff00;
        border: 0;
        box-shadow: none;
      }
      .weapon-display,
      .health-scope {
        border-color: transparent;
        background: rgba(127, 255, 0, 0.035);
      }
      .scope-ring {
        opacity: 0.25;
      }
      .weapon-core,
      .plant-core {
        box-shadow: none;
      }
      .close-btn {
        border-color: var(--line);
        background: transparent;
      }
      .close-btn:hover {
        color: #ffe66d;
        background: rgba(255, 230, 109, 0.12);
        box-shadow: none;
      }
      .buy-btn,
      .action-btn {
        color: #7fff00;
        border-color: rgba(127, 255, 0, 0.48);
        background: rgba(127, 255, 0, 0.13);
        box-shadow: none;
      }
      .buy-btn:hover,
      .action-btn:hover {
        background: rgba(127, 255, 0, 0.25);
        box-shadow: none;
        filter: none;
      }
      .buy-btn.selected,
      .action-btn.cart-selected {
        color: #262626;
        background: #7fff00;
        box-shadow: none;
      }
      button:focus-visible {
        outline: 1px solid #ffe66d;
        outline-offset: 2px;
      }

      /* ITEM health-scope */
      .health-scope.preview-card {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        align-items: stretch;
        justify-content: stretch;
        --preview-accent: #b88cff;
      }
      .preview-main {
        min-height: 0;
        display: grid;
        grid-template-columns: 34% minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .preview-art {
        width: 100%;
        height: 74px;
        object-fit: contain;
        opacity: 0.85;
        filter: grayscale(0.65) sepia(0.45) hue-rotate(95deg) saturate(0.65)
          brightness(1.12);
      }
      .preview-art[hidden] {
        display: none;
      }
      .preview-placeholder {
        text-align: center;
        font-size: 28px;
        color: var(--green-soft);
        opacity: 0.45;
      }
      .preview-placeholder[hidden] {
        display: none;
      }
      .preview-copy {
        min-width: 0;
      }
      .preview-label {
        color: var(--green-soft);
        font-size: 9px;
        letter-spacing: 0.5px;
      }
      .preview-name {
        color: var(--preview-accent);
        font-size: 16px;
        line-height: 1.05;
        margin: 3px 0;
        overflow-wrap: break-word;
      }
      .preview-detail {
        color: var(--mint);
        font-size: 10px;
        line-height: 1.3;
      }
      .preview-value {
        margin-top: 5px;
        color: var(--preview-accent);
        font-size: 12px;
      }
      .preview-status {
        min-width: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 9px;
        border-top: 1px solid var(--line);
        background: rgba(22, 22, 22, 0.35);
        color: var(--green-soft);
        font-size: 9px;
        line-height: 1.25;
      }
      .preview-status span {
        min-width: 0;
        overflow-wrap: break-word;
      }
      .preview-status strong {
        color: var(--preview-accent);
        font-weight: normal;
        text-align: right;
        flex-shrink: 0;
      }
      .perk-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: var(--preview-accent);
      }
      .note.insufficient-funds {
        animation: insufficient-funds-pulse 1400ms ease-in-out;
      }

      @keyframes insufficient-funds-pulse {
        0%,
        100% {
          border-color: rgba(127, 255, 0, 0.16);
          background: var(--panel-deep);
          box-shadow: none;
        }
        35% {
          border-color: rgba(238, 20, 38, 0.38);
          background: rgba(37, 37, 37, 0.94);
          box-shadow: inset 0 0 16px rgba(238, 20, 38, 0.05);
        }
      }

      /* SMALL SCREENS */
      .panel,
      .main-panel,
      .side-panel,
      .weapon-scope,
      .garden-scope {
        min-height: 0;
      }
      .side-panel {
        overflow-y: auto;
      }
      .side-panel::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      @media (max-height: 700px) {
        .content {
          padding: 8px 8px 12px;
          gap: 8px;
        }
        .main-panel,
        .side-panel {
          padding: 8px;
        }
        .side-panel {
          gap: 6px;
        }
        .data-header {
          margin-bottom: 6px;
          padding-bottom: 3px;
        }
        .bar-row {
          margin-bottom: 5px;
        }
        .bar {
          height: 8px;
        }
        .readout {
          padding: 5px 7px;
        }
        .readout-grid {
          gap: 5px;
        }
        .weapon-display,
        .health-scope {
          min-height: 90px;
        }
        .preview-main {
          padding: 6px 8px;
          gap: 6px;
        }
        .preview-art {
          height: 54px;
        }
        .notification-wrap {
          gap: 6px;
        }
        .note {
          padding: 7px;
        }
        .status-row {
          gap: 6px;
        }
        .metric {
          min-height: 60px;
          padding: 8px;
        }
      }

      @media (max-height: 600px) {
        .bar-meta {
          font-size: 11px;
          margin-bottom: 2px;
        }
        .bar-row {
          margin-bottom: 3px;
        }
        .data-header {
          font-size: 12px;
          margin-bottom: 4px;
        }
        .readout {
          padding: 3px 6px;
        }
        .readout strong {
          font-size: 12px;
        }
        .weapon-display,
        .health-scope {
          min-height: 70px;
        }
        .preview-art {
          height: 40px;
        }
        .side-panel {
          gap: 4px;
        }
      }

      @media (max-width: 850px) {
        .weapon-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .weapon-header,
        .strain-header {
          flex-wrap: wrap;
          gap: 6px;
        }
        .category-tabs,
        .strain-legend {
          flex-wrap: wrap;
        }
      }
          #actions { grid-template-columns: 1fr; }
      .legend-item { color: var(--strain-color); }
      #actions .action-btn { min-height: 48px; width: 100%; }
    </style>
  </head>
  <body>
    <main class="garden-ui">
      <header class="topbar" onmousedown="startDrag(event)">
        <div class="title-block">
          <div class="eyebrow" id="zone">SPECIAL PERKS</div>
          <h1 id="title">KRATOM SHOP</h1>
        </div>
        <button
          class="close-btn"
          type="button"
          tabindex="-1"
          onmousedown="event.stopPropagation()"
          onclick="closeGarden()"
        >
          X
        </button>
      </header>

      <section class="content">
        <div class="panel main-panel">
          <div class="status-row">
            <div class="metric">
              <div class="metric-label">Variety</div>
              <div class="metric-value" id="plants">--</div>
            </div>
            <div class="metric">
              <div class="metric-label">Price</div>
              <div class="metric-value" id="price">$0</div>
            </div>
            <div class="metric">
              <div class="metric-label">Stock</div>
              <div class="metric-value" id="stock">--</div>
            </div>
          </div>

          <div class="garden-scope">
            <div class="strain-header">
              <div class="data-header">KRATOM VARIETIES</div>
              <div class="strain-legend">
                <span class="legend-item" style="--strain-color: #e8eef0"
                  >White</span
                >
                <span class="legend-item" style="--strain-color: #7fff00"
                  >Green</span
                >
                <span class="legend-item" style="--strain-color: #b88cff"
                  >Purple</span
                >
              </div>
            </div>
            <div class="strain-grid" id="strain-grid"></div>
          </div>
        </div>

        <aside class="panel side-panel">
          <div>
            <div class="data-header">PERK TYPE</div>
            <div class="bar-row">
              <div class="bar-meta">
                <span style="color:#e8eef0">WHITE</span><strong id="white-text">0%</strong>
              </div>
              <div class="bar"><div class="fill" id="white-fill"></div></div>
            </div>
            <div class="bar-row">
              <div class="bar-meta">
                <span style="color:#7fff00">GREEN</span><strong id="green-text">0%</strong>
              </div>
              <div class="bar">
                <div class="fill" id="green-fill"></div>
              </div>
            </div>
            <div class="bar-row">
              <div class="bar-meta">
                <span style="color:#b88cff">PURPLE</span><strong id="purple-text">0%</strong>
              </div>
              <div class="bar"><div class="fill" id="purple-fill"></div></div>
            </div>
          </div>

          <div>
            <div class="data-header">STATS</div>
            <div class="readout-grid">
              <div class="readout">
                <span>Movement</span><strong id="gravity">--</strong>
              </div>
              <div class="readout">
                <span>Vision</span><strong id="speed">--</strong>
              </div>
              <div class="readout">
                <span>Signature</span><strong id="health-regen">--</strong>
              </div>
              <div class="readout">
                <span>Duration</span><strong id="armor-regen">--</strong>
              </div>
            </div>
          </div>

          <div class="health-scope preview-card" id="perk-preview">
            <div class="preview-main">
              <img class="preview-art" src="images/kratom-leaf.svg" alt="" />
              <div class="preview-copy">
                <div class="preview-label">SELECTED PERK</div>
                <div class="preview-name" id="preview-perk-name">
                  SELECT A VARIETY
                </div>
                <div class="preview-detail" id="preview-perk-effect">--</div>
                <div class="preview-value" id="preview-perk-duration">
                  5 MIN PERK DURATION
                </div>
              </div>
            </div>
            <div class="preview-status">
              <span id="preview-perk-active">NO ACTIVE PERK</span>
              <strong id="preview-perk-time">--</strong>
            </div>
            <div class="perk-progress" id="preview-perk-progress"></div>
          </div>

          <div class="notification-wrap">
            <div class="note">
              <div class="note-icon">!</div>
              <div>
                <div class="note-title">DESCRIPTION</div>
                <div class="note-message" id="note">SELECT A VARIETY.</div>
              </div>
            </div>
            <div class="button-grid" id="actions"></div>

          </div>
        </aside>
      </section>
    </main>

    <script>
      const defaults = {
        title: "KRATOM SHOP",
        zone: "SPECIAL PERKS",
        stock: "AVAILABLE",
        ready: 0,
        health: 0,
        water: 0,
        white: null,
        green: null,
        purple: null,
        gravity: "Normal",
        speed: "Normal",
        healthRegen: 0,
        armorRegen: 0,
        status: "Idle",
        cycle: "Live",
        note: "SELECT A VARIETY.",
        actions: [],
        buySizes: [],
        strains: [{"name":"WHITE","symbol":"W","type":"white","description":"SLOW MOVEMENT / DOUBLE HYBRID JUMP / WHITE NIGHT VISION.","white":100,"green":0,"purple":0,"prices":{"cart":2000}},{"name":"GREEN","symbol":"G","type":"green","description":"GREEN NIGHT VISION / REVEAL ZOMBIE SILHOUETTES FOR 3 SECONDS EVERY 15 SECONDS.","white":0,"green":100,"purple":0,"prices":{"cart":2000}},{"name":"PURPLE","symbol":"P","type":"purple","description":"FATAL DAMAGE GUARD / HEADSHOT AND NECK-STAB GUARD FOR 5 MINUTES.","white":0,"green":0,"purple":100,"prices":{"cart":2000}}],
      };

      const strainColors = {white:'#e8eef0',green:'#7fff00',purple:'#b88cff'};

      const strainStats = {
 white:{gravity:'SLOW',speed:'WHITE / GRAY',healthRegen:'2X HYBRID JUMP',armorRegen:'5 MIN'},
 green:{gravity:'NORMAL',speed:'NIGHT VISION',healthRegen:'ZOMBIE SCAN',armorRegen:'5 MIN'},
 purple:{gravity:'NORMAL',speed:'STANDARD',healthRegen:'FATAL GUARD',armorRegen:'5 MIN'}
};

      let selectedStrainValue = null;
      let selectedStrain = null;
      let selectedBuySizeValue = "cart";
      let displayedStrains = [];
      let strainCatalog = {};

      function applyStrainCatalog(strain) {
        return Object.assign({}, strain, strainCatalog[strain.name] || {});
      }

      window.updateGardenCatalog = function (catalog) {
        strainCatalog = catalog || {};
        displayedStrains = displayedStrains.map(applyStrainCatalog);
        if (selectedStrain) selectedStrain = applyStrainCatalog(selectedStrain);
        setStrains(displayedStrains);
        updatePrice();
      };

      let packageDurations = {cart:300000};
      let activePreview = { type: false, duration: 0, endsAt: 0 };
      const perkEffects = {white:'DOUBLE JUMP / WHITE NIGHT VISION',green:'GREEN NIGHT VISION / ZOMBIE SCAN',purple:'FATAL DAMAGE / EXECUTION GUARD'};

      function renderPerkPreview() {
        const type =
          selectedStrain &&
          String(selectedStrain.type || "purple").toLowerCase();
        document
          .getElementById("perk-preview")
          .style.setProperty(
            "--preview-accent",
            strainColors[type] || "#b88cff",
          );
        setText(
          "preview-perk-name",
          type ? type.toUpperCase() : "SELECT A VARIETY",
        );
        setText("preview-perk-effect", type ? perkEffects[type] || "--" : "--");
        const duration =
          selectedBuySizeValue && packageDurations[selectedBuySizeValue];
        setText(
          "preview-perk-duration",
          duration
            ? `${Math.round(duration / 60000)} MIN PERK DURATION`
            : "5 MIN PERK DURATION",
        );
      }

      function renderActivePerk() {
        const remaining = Math.max(0, activePreview.endsAt - Date.now());
        const active = activePreview.type && remaining > 0;
        const seconds = Math.ceil(remaining / 1000);
        setText(
          "preview-perk-active",
          active
            ? `ACTIVE PERK: ${String(activePreview.type).toUpperCase()}`
            : "NO ACTIVE PERK",
        );
        setText(
          "preview-perk-time",
          active
            ? `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")} LEFT`
            : "--",
        );
        const color = strainColors[activePreview.type] || "var(--green-soft)";
        document.getElementById("preview-perk-time").style.color = color;
        const progress = document.getElementById("preview-perk-progress");
        progress.style.backgroundColor = color;
        progress.style.width =
          active && activePreview.duration > 0
            ? `${Math.min(100, (remaining / activePreview.duration) * 100)}%`
            : "0%";
      }

      window.updatePerkPreview = function (preview) {
        activePreview = {
          type: preview.type || false,
          duration: Number(preview.duration) || 0,
          endsAt: Date.now() + Math.max(0, Number(preview.remaining) || 0),
        };
        renderActivePerk();
      };
      setInterval(renderActivePerk, 1000);

      function animatePurchase(button) {
        button.classList.remove("purchase-click");
        void button.offsetWidth;
        button.classList.add("purchase-click");
      }

      function updatePrice() {
        renderPerkPreview();
        setText(
          "stock",
          selectedStrain
            ? selectedStrain.available === false
              ? "UNAVAILABLE"
              : "AVAILABLE"
            : "--",
        );
        if (!selectedStrain || !selectedBuySizeValue) {
          setText("price", "--");
          return;
        }

        const price = selectedStrain.prices
          ? selectedStrain.prices[selectedBuySizeValue]
          : null;
        setText("price", Number.isInteger(price) ? `$${price}` : "--");
      }

      function clamp(value) {
        return Math.max(0, Math.min(100, Number(value) || 0));
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
        if (id === "note") {
          const box = document.getElementById(id).closest(".note");
          box.classList.remove("insufficient-funds");
          if (
            value === "SORRY, INSUFFICIENT FUNDS." ||
            value === "YO, GET SOME MONEY DAWG!"
          ) {
            void box.offsetWidth;
            box.classList.add("insufficient-funds");
          }
        }
      }

      function setBar(name, value, fixedColor) {
        const percent = clamp(value);
        const fill = document.getElementById(`${name}-fill`);
        const label = document.getElementById(`${name}-text`);

        fill.style.width = `${percent}%`;
        label.textContent = `${Math.round(percent)}%`;

        const color =
          fixedColor ||
          (percent < 30
            ? "var(--purple)"
            : percent < 55
              ? "var(--amber)"
              : "var(--green)");
        fill.style.backgroundColor = color;
        fill.style.boxShadow = "none";
      }

      function shuffleStrains(strains) {
        const shuffled = strains.slice();
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] = [
            shuffled[swapIndex],
            shuffled[index],
          ];
        }
        return shuffled;
      }

      function setActions() {
        const container = document.getElementById("actions");
        container.innerHTML = "";
        const button = document.createElement("button");
        button.className = "action-btn";
        button.type = "button";
        button.tabIndex = -1;
        button.textContent = "BUY";
        button.onclick = () => { animatePurchase(button); triggerAction("BUY"); };
        container.appendChild(button);
      }

      function clearPurchaseSelection() {
        document.querySelectorAll(".buy-btn.selected").forEach((button) => {
          button.classList.remove("selected");
        });
        document
          .querySelectorAll(".action-btn.cart-selected")
          .forEach((button) => {
            button.classList.remove("cart-selected");
          });
        selectedBuySizeValue = "cart";
        updatePrice();
      }

      function setStrains(strains) {
        const container = document.getElementById("strain-grid");
        container.innerHTML = "";

        strains.slice(0, 15).forEach((strain, index) => {
          const type = String(strain.type || "green").toLowerCase();
          const color =
            strain.color || strainColors[type] || strainColors.purple;
          const value =
            strain.value || strain.id || strain.name || strain.symbol;
          const button = document.createElement("button");
          button.className = "strain-tile";
          button.type = "button";
          button.tabIndex = -1;
          button.style.setProperty("--strain-color", color);
          button.title = `${strain.name} - ${type}`;

          const number = document.createElement("span");
          number.className = "strain-number";
          number.textContent = String(index + 1).padStart(2, "0");

          const check = document.createElement("span");
          check.className = "strain-check";

          const symbol = document.createElement("strong");
          symbol.className = "strain-symbol";
          symbol.textContent = strain.symbol;

          button.append(check, number, symbol);
          if (value === selectedStrainValue) {
            button.classList.add("selected");
          }
          button.onclick = () => {
            container.querySelectorAll(".strain-tile").forEach((tile) => {
              tile.classList.remove("selected");
            });
            clearPurchaseSelection();
            button.classList.add("selected");
            selectedStrainValue = value;
            selectedStrain = strain;
            setText("plants", String(index + 1).padStart(2, "0"));
            const selectedStats = strainStats[type] || strainStats.purple;
            setText("gravity", selectedStats.gravity);
            setText("speed", selectedStats.speed);
            setText("health-regen", selectedStats.healthRegen);
            setText("armor-regen", selectedStats.armorRegen);
            updatePrice();

            setBar("white", strain.white, strainColors.white);
            setBar("green", strain.green, strainColors.green);
            setBar("purple", strain.purple, strainColors.purple);
            setText(
              "note",
              `${strain.name}: ${strain.description || "Variety selected."}`,
            );
            triggerAction(`strain:${value}`);
          };
          container.appendChild(button);
        });
      }

      window.updateGarden = function updateGarden(payload) {
        const data = Object.assign({}, defaults, payload || {});
        if (data.strainCatalog) strainCatalog = data.strainCatalog;
        if (data.packageDurations) packageDurations = data.packageDurations;
        if (data.perkPreview) window.updatePerkPreview(data.perkPreview);
        const sourceStrains = Array.isArray(data.strains)
          ? data.strains
          : defaults.strains;

        if (data.resetSelection) {
          selectedStrainValue = null;
          selectedStrain = null;
          clearPurchaseSelection();
        }

        if (data.resetSelection || displayedStrains.length === 0) {
          displayedStrains =
            shuffleStrains(sourceStrains).map(applyStrainCatalog);
        }
        displayedStrains = displayedStrains.map(applyStrainCatalog);
        if (selectedStrain) selectedStrain = applyStrainCatalog(selectedStrain);

        setText("title", data.title);
        setText("zone", data.zone);
        const selectedStrainIndex = selectedStrain
          ? displayedStrains.findIndex(
              (strain) =>
                (strain.value || strain.id || strain.name || strain.symbol) ===
                selectedStrainValue,
            )
          : -1;
        setText(
          "plants",
          selectedStrainIndex >= 0
            ? String(selectedStrainIndex + 1).padStart(2, "0")
            : "--",
        );
        const selectedStats = selectedStrain
          ? strainStats[String(selectedStrain.type || "purple").toLowerCase()]
          : null;
        setText("gravity", selectedStats ? selectedStats.gravity : "READY");
        setText("speed", selectedStats ? selectedStats.speed : "OPTICS ONLINE");
        setText(
          "health-regen",
          selectedStats ? selectedStats.healthRegen : "SELECT VARIETY",
        );
        setText(
          "armor-regen",
          selectedStats ? selectedStats.armorRegen : "5 MIN",
        );
        setText("note", data.note);

        setBar(
          "white",
          selectedStrain && !data.resetSelection
            ? selectedStrain.white
            : data.white == null
              ? 0
              : data.white,
          strainColors.white,
        );
        setBar(
          "green",
          selectedStrain && !data.resetSelection
            ? selectedStrain.green
            : data.green == null
              ? 0
              : data.green,
          strainColors.green,
        );
        setBar(
          "purple",
          selectedStrain && !data.resetSelection
            ? selectedStrain.purple
            : data.purple == null
              ? 0
              : data.purple,
          strainColors.purple,
        );
        setActions(Array.isArray(data.actions) ? data.actions : []);

        setStrains(displayedStrains);
        updatePrice();
      };

      function closeGarden() {
        if (window.mta) {
          mta.triggerEvent("weedGarden:closeFromBrowser");
        }
      }

      function triggerAction(name) {
        if (window.mta) {
          mta.triggerEvent("weedGarden:actionFromBrowser", name);
        }
      }

      function startDrag(event) {
        if (event.button !== 0 || !window.mta) {
          return;
        }

        mta.triggerEvent("weedGarden:startDrag");
      }

      document.addEventListener("mouseup", () => {
        if (window.mta) {
          mta.triggerEvent("weedGarden:stopDrag");
        }
      });

      document.addEventListener(
        "keydown",
        (event) => {
          event.preventDefault();
          event.stopPropagation();
        },
        true,
      );

      document.addEventListener("copy", (event) => {
        event.preventDefault();
      });

      window.updateGarden(defaults);
    </script>
  </body>
</html>
