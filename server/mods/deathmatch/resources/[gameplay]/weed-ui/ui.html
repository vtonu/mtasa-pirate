<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap");

      :root {
        --green: #00ff66;
        --green-soft: #88ffaa;
        --mint: #b9ffd2;
        --amber: #ffe66d;
        --red: #ff4b6a;
        --panel: rgba(0, 18, 8, 0.72);
        --panel-deep: rgba(0, 8, 3, 0.84);
        --line: rgba(0, 255, 102, 0.38);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: "Share Tech Mono", monospace;
        color: var(--green);
        background: transparent;
        padding-bottom: 10px;
      }

      .garden-ui {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(0, 255, 102, 0.06),
            transparent 32%
          ),
          linear-gradient(135deg, rgba(0, 20, 8, 0.9), rgba(0, 8, 4, 0.72));
        box-shadow:
          inset 0 0 32px rgba(0, 255, 102, 0.05),
          0 0 14px rgba(0, 255, 102, 0.08);
      }

      .garden-ui::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025),
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 5px
        );
        opacity: 0.5;
      }

      .topbar {
        position: relative;
        z-index: 1;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: rgba(0, 30, 10, 0.62);
        border-bottom: 1px solid var(--line);
        cursor: move;
        user-select: none;
      }

      .title-block {
        min-width: 0;
      }

      .eyebrow {
        color: var(--green-soft);
        font-size: 11px;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 2px;
        font-family: "Orbitron", sans-serif;
        font-size: 18px;
        color: #fff;
        text-shadow: 0 0 7px rgba(0, 255, 102, 0.36);
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .close-btn {
        width: 34px;
        height: 34px;
        border: 1px solid rgba(185, 255, 210, 0.55);
        border-radius: 6px;
        color: var(--mint);
        background: rgba(0, 0, 0, 0.22);
        font-family: "Orbitron", sans-serif;
        cursor: pointer;
      }

      .close-btn:hover {
        border-color: var(--green);
        color: #fff;
        box-shadow: 0 0 14px rgba(0, 255, 102, 0.28);
      }

      .content {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 12px;
        height: calc(100vh - 56px);
        padding: 12px 12px 30px;
      }

      .panel {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: inset 0 0 16px rgba(0, 255, 102, 0.04);
        backdrop-filter: blur(4px);
      }

      .main-panel {
        display: flex;
        flex-direction: column;
        padding: 14px 14px 16px;
      }

      .status-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric {
        min-height: 74px;
        padding: 10px;
        border: 1px solid rgba(0, 255, 102, 0.22);
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.18);
      }

      .metric-label {
        color: var(--green-soft);
        font-size: 11px;
        text-transform: uppercase;
      }

      .metric-value {
        margin-top: 7px;
        font-family: "Orbitron", sans-serif;
        font-size: 20px;
        color: #fff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .garden-scope {
        position: relative;
        flex: 1;
        min-height: 180px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 10px;
        padding: 12px;
        overflow: hidden;
        border: 1px solid rgba(0, 255, 102, 0.28);
        border-radius: 8px;
        background:
          linear-gradient(rgba(0, 255, 102, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 102, 0.08) 1px, transparent 1px),
          rgba(0, 10, 3, 0.56);
        background-size: 28px 28px;
      }

      .strain-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .strain-header .data-header {
        flex: 1;
        margin: 0;
      }

      .strain-legend {
        display: flex;
        gap: 8px;
        color: var(--green-soft);
        font-size: 10px;
        text-transform: uppercase;
      }

      .legend-item::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 4px;
        border-radius: 2px;
        background: var(--strain-color);
        box-shadow: 0 0 7px var(--strain-color);
      }

      .strain-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        min-height: 0;
      }

      .strain-tile {
        position: relative;
        min-width: 0;
        min-height: 0;
        padding: 7px;
        overflow: hidden;
        border: 1px solid var(--strain-color);
        border-radius: 6px;
        color: var(--strain-color);
        background: rgba(0, 12, 5, 0.9);
        font-family: "Share Tech Mono", monospace;
        text-align: left;
        cursor: pointer;
        box-shadow: inset 0 0 9px rgba(0, 255, 102, 0.025);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }

      .strain-tile:hover {
        background: rgba(0, 18, 7, 0.94);
        transform: translateY(-1px);
      }

      .strain-tile.selected {
        transform: translateY(1px) scale(0.985);
        background: rgba(0, 5, 2, 0.96);
        box-shadow:
          inset 0 3px 9px rgba(0, 0, 0, 0.72),
          inset 0 0 10px rgba(0, 255, 102, 0.06);
      }

      .strain-check {
        position: absolute;
        top: 5px;
        left: 6px;
        width: 13px;
        height: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--strain-color);
        border-radius: 3px;
        color: transparent;
        background: rgba(0, 0, 0, 0.38);
        font-size: 10px;
        line-height: 1;
      }

      .strain-tile.selected .strain-check {
        color: #041007;
        background: var(--strain-color);
        box-shadow: 0 0 6px var(--strain-color);
      }

      .strain-tile.selected .strain-check::after {
        content: "\2713";
      }

      .strain-number {
        position: absolute;
        top: 5px;
        right: 6px;
        font-size: 9px;
        opacity: 0.72;
      }

      .strain-symbol {
        display: block;
        margin-top: 5px;
        color: #fff;
        font-family: "Orbitron", sans-serif;
        font-size: clamp(15px, 2.4vw, 24px);
        line-height: 1;
        text-shadow: none;
      }

      .strain-tile.selected .strain-symbol {
        text-shadow: none;
      }

      .strain-name {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        font-size: 9px;
        line-height: 1.05;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scope-ring {
        position: absolute;
        width: min(58vh, 58vw);
        max-width: 340px;
        aspect-ratio: 1;
        border: 2px dashed rgba(0, 255, 102, 0.42);
        border-radius: 50%;
        animation: spin 30s linear infinite;
      }

      .scope-ring.inner {
        width: min(34vh, 34vw);
        max-width: 210px;
        border-style: dotted;
        animation-duration: 16s;
        animation-direction: reverse;
      }

      .plant-core {
        position: relative;
        width: 138px;
        height: 138px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid rgba(185, 255, 210, 0.55);
        background: rgba(0, 30, 10, 0.5);
        box-shadow:
          0 0 34px rgba(0, 255, 102, 0.2),
          inset 0 0 22px rgba(0, 255, 102, 0.18);
      }

      .leaf {
        position: absolute;
        width: 46px;
        height: 72px;
        background: linear-gradient(
          180deg,
          rgba(185, 255, 210, 0.96),
          rgba(0, 255, 102, 0.36)
        );
        border-radius: 48% 52% 48% 52%;
        transform-origin: 50% 90%;
        box-shadow: 0 0 16px rgba(0, 255, 102, 0.28);
      }

      .leaf:nth-child(1) {
        transform: rotate(0deg) translateY(-24px);
      }
      .leaf:nth-child(2) {
        transform: rotate(60deg) translateY(-24px);
      }
      .leaf:nth-child(3) {
        transform: rotate(120deg) translateY(-24px);
      }
      .leaf:nth-child(4) {
        transform: rotate(180deg) translateY(-24px);
      }
      .leaf:nth-child(5) {
        transform: rotate(240deg) translateY(-24px);
      }
      .leaf:nth-child(6) {
        transform: rotate(300deg) translateY(-24px);
      }

      .core-text {
        position: relative;
        z-index: 2;
        text-align: center;
        color: #fff;
        text-shadow: 0 0 10px var(--green);
      }

      .core-text strong {
        display: block;
        font-family: "Orbitron", sans-serif;
        font-size: 26px;
      }

      .core-text span {
        color: var(--green-soft);
        font-size: 11px;
        text-transform: uppercase;
      }

      .side-panel {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 10px;
        padding: 12px 12px 20px;
      }

      .health-scope {
        position: relative;
        min-height: 118px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(0, 255, 102, 0.22);
        border-radius: 7px;
        background:
          radial-gradient(circle, rgba(0, 255, 102, 0.11), transparent 64%),
          rgba(0, 8, 3, 0.48);
      }

      .health-scope .scope-ring {
        width: 88px;
        max-width: none;
      }

      .health-scope .scope-ring.inner {
        width: 65px;
        max-width: none;
      }

      .health-scope .plant-core {
        width: 56px;
        height: 56px;
      }

      .health-scope .leaf {
        width: 17px;
        height: 27px;
      }

      .health-scope .leaf:nth-child(1) {
        transform: rotate(0deg) translateY(-8px);
      }
      .health-scope .leaf:nth-child(2) {
        transform: rotate(60deg) translateY(-8px);
      }
      .health-scope .leaf:nth-child(3) {
        transform: rotate(120deg) translateY(-8px);
      }
      .health-scope .leaf:nth-child(4) {
        transform: rotate(180deg) translateY(-8px);
      }
      .health-scope .leaf:nth-child(5) {
        transform: rotate(240deg) translateY(-8px);
      }
      .health-scope .leaf:nth-child(6) {
        transform: rotate(300deg) translateY(-8px);
      }

      .health-scope .core-text strong {
        font-size: 13px;
      }

      .health-scope .core-text span {
        font-size: 7px;
      }

      .data-header {
        color: #fff;
        font-family: "Orbitron", sans-serif;
        font-size: 13px;
        border-bottom: 1px solid rgba(0, 255, 102, 0.25);
        padding-bottom: 6px;
        margin-bottom: 10px;
      }

      .bar-row {
        margin-bottom: 7px;
      }

      .bar-meta {
        display: flex;
        justify-content: space-between;
        color: var(--green-soft);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .bar {
        height: 10px;
        overflow: hidden;
        border: 1px solid rgba(0, 255, 102, 0.42);
        background: rgba(0, 12, 4, 0.8);
      }

      .fill {
        width: 50%;
        height: 100%;
        background: var(--green);
        box-shadow: none;
        transition:
          width 0.18s ease,
          background-color 0.18s ease;
      }

      .readout-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .readout {
        padding: 7px 9px;
        border: 1px solid rgba(0, 255, 102, 0.2);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.16);
      }

      .readout span {
        display: block;
        color: var(--green-soft);
        font-size: 11px;
        text-transform: uppercase;
      }

      .readout strong {
        display: block;
        margin-top: 4px;
        color: #fff;
        font-family: "Orbitron", sans-serif;
        font-size: 16px;
      }

      .notification-wrap {
        display: grid;
        gap: 8px;
        min-height: 0;
      }

      .note {
        height: 72px;
        min-height: 72px;
        overflow: hidden;
        padding: 10px;
        border: 1px solid rgba(0, 255, 102, 0.2);
        border-radius: 6px;
        color: var(--mint);
        background: var(--panel-deep);
        line-height: 1.35;
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 9px;
        align-items: start;
      }

      .note-icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(0, 255, 102, 0.5);
        border-radius: 50%;
        color: #061006;
        background: var(--green);
        font-family: "Orbitron", sans-serif;
        font-size: 17px;
        box-shadow: 0 0 16px rgba(0, 255, 102, 0.32);
      }

      .note-title {
        color: #fff;
        font-family: "Orbitron", sans-serif;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .note-message {
        color: var(--mint);
        font-size: 13px;
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .buy-section {
        display: grid;
        gap: 7px;
      }

      .buy-title {
        color: var(--green-soft);
        font-size: 11px;
        text-transform: uppercase;
      }

      .action-btn,
      .buy-btn {
        min-height: 34px;
        padding: 7px 8px;
        border: 1px solid rgba(0, 255, 102, 0.45);
        border-radius: 6px;
        color: var(--green);
        background: rgba(0, 35, 12, 0.56);
        font-family: "Share Tech Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .buy-btn {
        color: var(--mint);
        background: rgba(0, 20, 8, 0.7);
      }

      .buy-btn.selected,
      .action-btn.cart-selected {
        color: #fff;
        border-color: var(--green);
        background: rgba(0, 5, 2, 0.96);
        box-shadow:
          0 0 7px rgba(0, 255, 102, 0.28),
          inset 0 3px 8px rgba(0, 0, 0, 0.72);
        transform: translateY(1px);
      }

      .action-btn:hover,
      .buy-btn:hover {
        color: #061006;
        background: var(--green);
        box-shadow: 0 0 16px rgba(0, 255, 102, 0.34);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="garden-ui">
      <header class="topbar" onmousedown="startDrag(event)">
        <div class="title-block">
          <div class="eyebrow" id="zone">Fog of War Garden</div>
          <h1 id="title">System Monitor</h1>
        </div>
        <button
          class="close-btn"
          type="button"
          onmousedown="event.stopPropagation()"
          onclick="closeGarden()"
        >
          X
        </button>
      </header>

      <section class="content">
        <div class="panel main-panel">
          <div class="status-row">
            <div class="metric">
              <div class="metric-label">Flower</div>
              <div class="metric-value" id="plants">0</div>
            </div>
            <div class="metric">
              <div class="metric-label">Price</div>
              <div class="metric-value" id="price">$0</div>
            </div>
            <div class="metric">
              <div class="metric-label">Stock</div>
              <div class="metric-value" id="stock">Available</div>
            </div>
          </div>

          <div class="garden-scope">
            <div class="strain-header">
              <div class="data-header">Harvest Strains</div>
              <div class="strain-legend">
                <span class="legend-item" style="--strain-color: #b88cff"
                  >Indica</span
                >
                <span class="legend-item" style="--strain-color: #ffe66d"
                  >Sativa</span
                >
                <span class="legend-item" style="--strain-color: #00ff9d"
                  >Hybrid</span
                >
              </div>
            </div>
            <div class="strain-grid" id="strain-grid"></div>
          </div>
        </div>

        <aside class="panel side-panel">
          <div>
            <div class="data-header">Plant Effects</div>
            <div class="bar-row">
              <div class="bar-meta">
                <span>Indica</span><strong id="indica-text">0%</strong>
              </div>
              <div class="bar"><div class="fill" id="indica-fill"></div></div>
            </div>
            <div class="bar-row">
              <div class="bar-meta">
                <span>Sativa</span><strong id="sativa-text">0%</strong>
              </div>
              <div class="bar">
                <div class="fill" id="sativa-fill"></div>
              </div>
            </div>
            <div class="bar-row">
              <div class="bar-meta">
                <span>Hybrid</span><strong id="hybrid-text">0%</strong>
              </div>
              <div class="bar"><div class="fill" id="hybrid-fill"></div></div>
            </div>
          </div>

          <div>
            <div class="data-header">Greenhouse Readout</div>
            <div class="readout-grid">
              <div class="readout">
                <span>Temperature</span><strong id="temperature">0 C</strong>
              </div>
              <div class="readout">
                <span>Humidity</span><strong id="humidity">0%</strong>
              </div>
              <div class="readout">
                <span>Stage</span><strong id="stage">Seed</strong>
              </div>
              <div class="readout">
                <span>Cycle</span><strong id="cycle">Live</strong>
              </div>
            </div>
          </div>

          <div class="health-scope">
            <div class="scope-ring"></div>
            <div class="scope-ring inner"></div>
            <div class="plant-core">
              <div class="leaf"></div>
              <div class="leaf"></div>
              <div class="leaf"></div>
              <div class="leaf"></div>
              <div class="leaf"></div>
              <div class="leaf"></div>
              <div class="core-text">
                <strong id="health-core">0%</strong>
                <span>Health</span>
              </div>
            </div>
          </div>

          <div class="notification-wrap">
            <div class="note">
              <div class="note-icon">!</div>
              <div>
                <div class="note-title">Description</div>
                <div class="note-message" id="note">No garden data loaded.</div>
              </div>
            </div>
            <div class="button-grid" id="actions"></div>
            <div class="buy-section">
              <div class="buy-title">Buy Sizes</div>
              <div class="button-grid" id="buy-sizes"></div>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <script>

          },
          {
            symbol: "DP",

          {

              "A smooth hybrid with sweet berry, mint, and cool citrus notes.",

      };

      const strainColors = {
        indica: "#b88cff",
        sativa: "#ffe66d",
        hybrid: "#00ff9d",
      };

      let selectedStrainValue = null;
      let selectedStrain = null;
      let selectedBuySizeValue = null;

      function updatePrice() {
        if (!selectedStrain || !selectedBuySizeValue) {
          setText("price", "--");
          return;
        }

        const price = selectedStrain.prices
          ? selectedStrain.prices[selectedBuySizeValue]
          : null;
        setText("price", Number.isInteger(price) ? `$${price}` : "--");
      }

      function clamp(value) {
        return Math.max(0, Math.min(100, Number(value) || 0));
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function setBar(name, value, fixedColor) {
        const percent = clamp(value);
        const fill = document.getElementById(`${name}-fill`);
        const label = document.getElementById(`${name}-text`);

        fill.style.width = `${percent}%`;
        label.textContent = `${Math.round(percent)}%`;

        const color =
          fixedColor ||
          (percent < 30
            ? "var(--red)"
            : percent < 55
              ? "var(--amber)"
              : "var(--green)");
        fill.style.backgroundColor = color;
        fill.style.boxShadow = "none";
      }

      function setActions(actions) {
        const container = document.getElementById("actions");
        container.innerHTML = "";

        actions.slice(0, 3).forEach((name) => {
          const button = document.createElement("button");
          button.className = "action-btn";
          button.type = "button";
          button.textContent = name;
          const isCart = String(name).toUpperCase() === "CART";
          if (isCart && selectedBuySizeValue === "cart") {
            button.classList.add("cart-selected");
          }
          button.onclick = () => {
            if (isCart) {
              clearPurchaseSelection();
              button.classList.add("cart-selected");
              selectedBuySizeValue = "cart";
              updatePrice();
            }
            triggerAction(name);
          };
          container.appendChild(button);
        });
      }

      function clearPurchaseSelection() {
        document.querySelectorAll(".buy-btn.selected").forEach((button) => {
          button.classList.remove("selected");
        });
        document
          .querySelectorAll(".action-btn.cart-selected")
          .forEach((button) => {
            button.classList.remove("cart-selected");
          });
        selectedBuySizeValue = null;
        updatePrice();
      }

      function setBuySizes(sizes) {
        const container = document.getElementById("buy-sizes");
        container.innerHTML = "";

        sizes.slice(0, 3).forEach((size) => {
          const label = typeof size === "string" ? size : size.label;
          const value = typeof size === "string" ? size : size.value;
          const button = document.createElement("button");
          button.className = "buy-btn";
          button.type = "button";
          button.textContent = label;
          if (value === selectedBuySizeValue) {
            button.classList.add("selected");
          }
          button.onclick = () => {
            clearPurchaseSelection();
            button.classList.add("selected");
            selectedBuySizeValue = value;
            updatePrice();
            triggerAction(`buy:${value}`);
          };
          container.appendChild(button);
        });
      }

      function setStrains(strains) {
        const container = document.getElementById("strain-grid");
        container.innerHTML = "";

        strains.slice(0, 15).forEach((strain, index) => {
          const type = String(strain.type || "hybrid").toLowerCase();
          const color =
            strain.color || strainColors[type] || strainColors.hybrid;
          const value =
            strain.value || strain.id || strain.name || strain.symbol;
          const button = document.createElement("button");
          button.className = "strain-tile";
          button.type = "button";
          button.style.setProperty("--strain-color", color);
          button.title = `${strain.name} - ${type}`;

          const number = document.createElement("span");
          number.className = "strain-number";
          number.textContent = String(index + 1).padStart(2, "0");

          const check = document.createElement("span");
          check.className = "strain-check";

          const symbol = document.createElement("strong");
          symbol.className = "strain-symbol";
          symbol.textContent = strain.symbol;

          button.append(check, number, symbol);
          if (value === selectedStrainValue) {
            button.classList.add("selected");
          }
          button.onclick = () => {
            container.querySelectorAll(".strain-tile").forEach((tile) => {
              tile.classList.remove("selected");
            });
            clearPurchaseSelection();
            button.classList.add("selected");
            selectedStrainValue = value;
            selectedStrain = strain;
            updatePrice();
            if (strain.health != null) {
              setText("health-core", `${Math.round(clamp(strain.health))}%`);
            }
            setBar("indica", strain.indica, strainColors.indica);
            setBar("sativa", strain.sativa, strainColors.sativa);
            setBar("hybrid", strain.hybrid, strainColors.hybrid);
            setText(
              "note",
              `${strain.name}: ${strain.description || "Strain selected."}`,
            );
            triggerAction(`strain:${value}`);
          };
          container.appendChild(button);
        });
      }

      window.updateGarden = function updateGarden(payload) {
        const data = Object.assign({}, defaults, payload || {});

        if (data.resetSelection) {
          selectedStrainValue = null;
          selectedStrain = null;
          clearPurchaseSelection();
        }

        setText("title", data.title);
        setText("zone", data.zone);
        setText("plants", data.plants);
        setText("stage", data.stage);
        setText("stock", data.stock || "Available");
        const displayedHealth =
          selectedStrain && !data.resetSelection
            ? selectedStrain.health
            : data.health;
        setText("health-core", `${Math.round(clamp(displayedHealth))}%`);
        setText("temperature", `${data.temperature} C`);
        setText("humidity", `${data.humidity}%`);
        setText("cycle", data.cycle || "Live");
        setText("note", data.note);

        setBar(
          "indica",
          selectedStrain && !data.resetSelection
            ? selectedStrain.indica
            : data.indica == null
              ? data.water
              : data.indica,
          strainColors.indica,
        );
        setBar(
          "sativa",
          selectedStrain && !data.resetSelection
            ? selectedStrain.sativa
            : data.sativa == null
              ? data.nutrients
              : data.sativa,
          strainColors.sativa,
        );
        setBar(
          "hybrid",
          selectedStrain && !data.resetSelection
            ? selectedStrain.hybrid
            : data.hybrid == null
              ? data.light
              : data.hybrid,
          strainColors.hybrid,
        );
        setActions(Array.isArray(data.actions) ? data.actions : []);
        setBuySizes(
          Array.isArray(data.buySizes) ? data.buySizes : defaults.buySizes,
        );
        setStrains(
          Array.isArray(data.strains) ? data.strains : defaults.strains,
        );
        updatePrice();
      };

      function closeGarden() {
        if (window.mta) {
          mta.triggerEvent("weedGarden:closeFromBrowser");
        }
      }

      function triggerAction(name) {
        if (window.mta) {
          mta.triggerEvent("weedGarden:actionFromBrowser", name);
        }
      }

      function startDrag(event) {
        if (event.button !== 0 || !window.mta) {
          return;
        }

        mta.triggerEvent("weedGarden:startDrag");
      }

      document.addEventListener("mouseup", () => {
        if (window.mta) {
          mta.triggerEvent("weedGarden:stopDrag");
        }
      });

      window.updateGarden(defaults);
    </script>
