<config>
  <!-- server name shown in browser -->
  <servername>Lifestyle Gaming</servername>

  <!-- server description visible in browser -->
  <rule name="description" value="Local Custom Freeroam Server" />

  <!-- supported language -->
  <rule name="languages" value="en" />

  <!-- server tags shown in browser -->
  <rule name="tags" value="freeroam" />

  <!-- Instagram handle -->
  <rule name="social_url_1" value="https://instagram.com/lifestylegamingclips" />

  <!-- TikTok handle -->
  <rule name="social_url_2" value="https://tiktok.com/@lifestylegamingclips" />

  <!-- YouTube handle -->
  <rule name="social_url_3" value="https://youtube.com/@lifestylegamingclips" />

  <!-- owner contact email (optional) -->
  <owner_email_address>lifestylegamingclips@gmail.com</owner_email_address>

  <!-- local IP auto detection -->
  <serverip>auto</serverip>

  <!-- UDP port for game connections -->
  <serverport>22003</serverport>

  <!-- maximum local players -->
  <maxplayers>2</maxplayers>

  <!-- HTTP port for resource downloads -->
  <httpport>22005</httpport>

  <!-- no external download URL -->
  <httpdownloadurl></httpdownloadurl>

  <!-- per-client max HTTP connections -->
  <httpmaxconnectionsperclient>5</httpmaxconnectionsperclient>

  <!-- HTTP DoS threshold -->
  <httpdosthreshold>20</httpdosthreshold>

  <!-- exclude IPs from HTTP DOS limits -->
  <http_dos_exclude></http_dos_exclude>

  <!-- allow local GTA skin mods -->
  <allow_gta3_img_mods>none</allow_gta3_img_mods>

  <!-- disabled anti-cheat list -->
  <disableac></disableac>

  <!-- enabled special detections -->
  <enablesd></enablesd>

  <!-- minimum client version allowed -->
  <minclientversion>1.6.0-9.24109.0</minclientversion>

  <!-- auto-update minimum client version -->
  <minclientversion_auto_update>1</minclientversion_auto_update>

  <!-- recommended client version prompt -->
  <recommendedclientversion></recommendedclientversion>

  <!-- disable master server reporting -->
  <ase>0</ase>

  <!-- disable LAN broadcast -->
  <donotbroadcastlan>0</donotbroadcastlan>

  <!-- server password (blank = none) -->
  <password></password>

  <!-- bandwidth optimization level -->
  <bandwidth_reduction>medium</bandwidth_reduction>

  <!-- normal player sync interval -->
  <player_sync_interval>100</player_sync_interval>

  <!-- low-priority player sync interval -->
  <lightweight_sync_interval>1500</lightweight_sync_interval>

  <!-- camera sync interval -->
  <camera_sync_interval>500</camera_sync_interval>

  <!-- pedestrian sync interval -->
  <ped_sync_interval>400</ped_sync_interval>

  <!-- distant pedestrian sync interval -->
  <ped_far_sync_interval>2000</ped_far_sync_interval>

  <!-- private key file -->
  <idfile>server-id.keys</idfile>

  <!-- main server log file -->
  <logfile>logs/server.log</logfile>

  <!-- authentication log file -->
  <authfile>logs/server_auth.log</authfile>

  <!-- database query log file -->
  <dbfile>logs/db.log</dbfile>

  <!-- ACL configuration file -->
  <acl>acl.xml</acl>

  <!-- script debug log file -->
  <scriptdebuglogfile>logs/scripts.log</scriptdebuglogfile>

  <!-- script debug level -->
  <scriptdebugloglevel>0</scriptdebugloglevel>

  <!-- HTML debug level -->
  <htmldebuglevel>0</htmldebuglevel>

  <!-- duplicate log filtering -->
  <filter_duplicate_log_lines>1</filter_duplicate_log_lines>

  <!-- frame rate limit -->
  <fpslimit>60</fpslimit>

  <!-- voice chat disabled -->
  <voice>0</voice>

  <!-- voice sample rate -->
  <voice_samplerate>1</voice_samplerate>

  <!-- voice quality level -->
  <voice_quality>4</voice_quality>

  <!-- backup folder -->
  <backup_path>backups</backup_path>

  <!-- backup interval in days -->
  <backup_interval>3</backup_interval>

  <!-- number of backups kept -->
  <backup_copies>5</backup_copies>

  <!-- internal DB compacting behavior -->
  <compact_internal_databases>1</compact_internal_databases>

  <!-- crash dump upload enabled -->
  <crash_dump_upload>1</crash_dump_upload>

  <!-- serial auth groups -->
  <auth_serial_groups>Admin</auth_serial_groups>

  <!-- serial auth for HTTP -->
  <auth_serial_http>1</auth_serial_http>

  <!-- HTTP serial auth exceptions -->
  <auth_serial_http_ip_exceptions>127.0.0.1</auth_serial_http_ip_exceptions>

  <!-- DB credential protection -->
  <database_credentials_protection>1</database_credentials_protection>

  <!-- element data protection -->
  <elementdata_whitelisted>0</elementdata_whitelisted>

  <!-- duplicate serial check -->
  <check_duplicate_serials>1</check_duplicate_serials>

  <!-- event interval limit -->
  <player_triggered_event_interval>1000</player_triggered_event_interval>

  <!-- max client events per interval -->
  <max_player_triggered_events_per_interval>100</max_player_triggered_events_per_interval>

  <!-- client file validation for PNG/DFF/TXD -->
  <resource_client_file_checks>1</resource_client_file_checks>

  <!-- module loading is optional -->
  <!--<module src="sample_win32.dll"/>-->
  <!--<module src="sample_linux.so"/>-->

  <resource src="admin" startup="1" protected="0" />
  <resource src="defaultstats" startup="1" protected="0" />
  <resource src="reload" startup="1" protected="0" />
  <resource src="resourcebrowser" startup="1" protected="1" default="true" />
  <resource src="resourcemanager" startup="1" protected="1" />
  <resource src="spawnmanager" startup="1" protected="0" />
  <resource src="speedometer" startup="1" protected="0" />
  <resource src="play" startup="1" protected="0" />
  <resource src="getplayerp" startup="1" protected="0" />
  <resource src="blur" startup="1" protected="0" />
  <resource src="alogin" startup="1" protected="0" />
  <resource src="nametags" startup="1" protected="0" />
  <resource src="pirate-map" startup="1" protected="0" />
  <resource src="weed-ui" startup="1" protected="0" />
  <resource src="booty-ui" startup="1" protected="0" />
</config>
